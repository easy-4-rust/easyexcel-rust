[workspace]
members = [
    "crates/easyexcel-cache",
    "crates/easyexcel-format",
    "crates/easyexcel-utils",
    "crates/easyexcel-model",
    "crates/easyexcel-formula",
    "crates/easyexcel-io",
    "crates/easyexcel-xls",
    "crates/easyexcel-xlsx",
    "crates/easyexcel-csv",
    "crates/easyexcel-tabular",
    "crates/easyexcel-derive",
    "xtask",
    "crates/easyexcel",
    "crates/easyexcel-axum",
    "crates/easyexcel-actix",
    "crates/easyexcel-hyper",
    "crates/easyexcel-poem",
    "crates/easyexcel-rocket",
    "crates/easyexcel-salvo",
    "crates/easyexcel-warp",
    "tests/easyexcel-test",
    "examples/axum",
    "examples/actix",
    "examples/read",
    "examples/write",
    "examples/fill",
    "benchmarks/rust-runner",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/easy-4-rust/easyexcel-rust"
homepage = "https://github.com/easy-4-rust/easyexcel-rust"
description = "Alibaba EasyExcel 4.0.3 的 Rust 迁移——高保真读写 XLSX/XLS/CSV，恒定内存流式"
keywords = ["excel", "xlsx", "easyexcel", "spreadsheet", "csv"]
categories = ["parser-implementations", "encoding"]

[workspace.dependencies]
easyexcel = { path = "crates/easyexcel", version = "0.1.0-alpha.1" }
easyexcel-actix = { path = "crates/easyexcel-actix", version = "0.1.0-alpha.1" }
easyexcel-axum = { path = "crates/easyexcel-axum", version = "0.1.0-alpha.1" }
easyexcel-cache = { path = "crates/easyexcel-cache", version = "0.1.0-alpha.1" }
easyexcel-format = { path = "crates/easyexcel-format", version = "0.1.0-alpha.1" }
easyexcel-utils = { path = "crates/easyexcel-utils", version = "0.1.0-alpha.1" }
easyexcel-model = { path = "crates/easyexcel-model", version = "0.1.0-alpha.1" }
easyexcel-formula = { path = "crates/easyexcel-formula", version = "0.1.0-alpha.1" }
easyexcel-io = { path = "crates/easyexcel-io", version = "0.1.0-alpha.1" }
easyexcel-xls = { path = "crates/easyexcel-xls", version = "0.1.0-alpha.1" }
easyexcel-xlsx = { path = "crates/easyexcel-xlsx", version = "0.1.0-alpha.1" }
easyexcel-csv = { path = "crates/easyexcel-csv", version = "0.1.0-alpha.1" }
easyexcel-tabular = { path = "crates/easyexcel-tabular", version = "0.1.0-alpha.1" }
easyexcel-derive = { path = "crates/easyexcel-derive", version = "0.1.0-alpha.1" }
anyhow = "1.0.102"
actix-multipart = "0.8.0"
actix-web = "4.11.0"
aes = "0.8.4"
axum = "0.8.9"
base64 = "0.23.0"
bigdecimal = "0.4.10"
bytes = "1.11.1"
calamine = { version = "0.36.0", features = ["chrono"] }
cfb = "0.14.0"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
csv = "1.4.0"
encoding_rs = "0.8.35"
encoding_rs_io = "0.1.7"
flate2 = "1.1.9"
futures-util = "0.3.33"
getrandom = "0.4"
http = "1.4.0"
http-body-util = "0.1.3"
hyper = "1.11.0"
libc = "0.2.189"
poem = "3.1.12"
rocket = "0.5.1"
salvo = "0.95.1"
warp = "0.4.3"
md-5 = "0.11.0"
moka = { version = "0.12.15", features = ["sync"] }
ms-offcrypto-writer = "1.0.7"
num-bigint = "0.4.8"  # bigdecimal 0.4.10 支持的最高 num-bigint 线
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
pure-rust-locales = "0.8.2"
quick-xml = "0.41.0"
quote = "1.0.47"
rand = "0.9.5"  # ms-offcrypto-writer 1.0.7 支持的最高 rand 线
regex = { version = "1.11.1", default-features = false, features = ["std", "unicode"] }
rust_xlsxwriter = { version = "0.97.0", features = ["chrono", "constant_memory", "zlib"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.10.6"
sha2 = "0.10.9"
ssfmt = { version = "0.1.2", default-features = false }
sys-locale = "0.3.2"
syn = { version = "3.0.3", features = ["full"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
url = "2.5.8"
urlencoding = "2.1.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
