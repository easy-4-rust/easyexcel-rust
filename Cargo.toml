[workspace]
members = [
    "xtask",
    "crates/easyexcel",
    "crates/easyexcel-core",
    "crates/easyexcel-macro",
    "crates/easyexcel-reader",
    "crates/easyexcel-template",
    "crates/easyexcel-writer",
    "crates/easyexcel-web/easyexcel-web-axum",
    "crates/easyexcel-web/easyexcel-web-actix",
    "crates/easyexcel-demo/easyexcel-demo-axum",
    "crates/easyexcel-demo/easyexcel-demo-actix",
    "crates/easyexcel-demo/easyexcel-demo-read",
    "crates/easyexcel-demo/easyexcel-demo-write",
    "crates/easyexcel-demo/easyexcel-demo-fill",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/easy-4-rust/easyexcel-rust"

[workspace.dependencies]
easyexcel = { path = "crates/easyexcel" }
easyexcel-core = { path = "crates/easyexcel-core" }
actix-multipart = "0.8.0"
actix-web = "4.11.0"
axum = "0.8.9"
base64 = "0.23.0"
bigdecimal = "0.4.10"
bytes = "1.11.1"
calamine = { version = "0.36.0", features = ["chrono"] }
cfb = "0.14.0"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
csv = "1.4.0"
encoding_rs = "0.8.35"
encoding_rs_io = "0.1.7"
flate2 = "1.1.9"
futures-util = "0.3.31"
getrandom = "0.4.3"
http = "1.4.0"
http-body-util = "0.1.3"
md-5 = "0.11.0"
ms-offcrypto-writer = "1.0.7"
num-bigint = "0.5.1"
office-crypto = "0.3.0"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
pure-rust-locales = "0.8.2"
quick-xml = "0.41.0"
quote = "1.0.47"
rand = "0.10.2"
rust_xlsxwriter = { version = "0.96.0", features = ["chrono", "constant_memory"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ssfmt = { version = "0.1.2", default-features = false }
sys-locale = "0.3.2"
syn = { version = "3.0.3", features = ["full"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread"] }
tower = "0.5.3"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
url = "2.5.8"
urlencoding = "2.1.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
