[package]
name = "easyexcel"
description = "A Rust implementation of the Alibaba EasyExcel programming model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# 内部 proc-macro（保持独立 crate）
easyexcel-macro = { path = "../easyexcel-macro", version = "0.1.0-alpha.1" }
# 原 easyexcel-core 依赖
bigdecimal.workspace = true
chrono.workspace = true
num-bigint.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
ureq.workspace = true
url.workspace = true
# 原 easyexcel-reader 依赖
calamine.workspace = true
cfb.workspace = true
# 公式缓存值求值引擎：fork of zemse/xls（https://github.com/easy-4-rust/xls，
# MIT OR Apache-2.0）。git 依赖 + rev pin：升级 = 改 rev + cargo update；
# rev 锁死保证干净 CI checkout 可复现构建（不用仓库外 path，也不 vendor
# 源码进仓库——fork 活跃演进，vendor 会让升级变成手动同步）。
# rev 7e35706 = 增强分支 enh-biff8-arrays（动态数组 spill 缓存持久化 +
# BIFF8 MULRK/MULBLANK/PANE 写入增强）；main=d8ede4f 保持 zemse 官方同步。
xls = { git = "https://github.com/easy-4-rust/xls.git", rev = "7e3570654d95b65763cee83316b3533b2645256a", default-features = false }
csv.workspace = true
encoding_rs.workspace = true
encoding_rs_io.workspace = true
office-crypto.workspace = true
pure-rust-locales.workspace = true
quick-xml.workspace = true
ssfmt.workspace = true
sys-locale.workspace = true
zip.workspace = true
# 原 easyexcel-writer 依赖
flate2.workspace = true
getrandom.workspace = true
md-5.workspace = true
ms-offcrypto-writer.workspace = true
rand.workspace = true
# ms-offcrypto-writer 1.0.7 固定 rand 0.9（其 CryptoRng 来自 rand_core 0.9），
# 而 workspace rand 0.10.2 的 rng 实现 rand_core 0.10 的 trait——加密路径
# 只能用 0.9 别名桥接；上游支持 rand 0.10 后移除本依赖并切回 rand::rngs::SysRng。
rand09 = { package = "rand", version = "0.9" }
rust_xlsxwriter.workspace = true

[dev-dependencies]
easyexcel-macro = { path = "../easyexcel-macro", version = "0.1.0-alpha.1" }
base64.workspace = true

[lints]
workspace = true
