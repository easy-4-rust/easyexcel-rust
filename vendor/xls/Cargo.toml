# Vendored fork of zemse/xls at https://github.com/easy-4-rust/xls
# (commit d8ede4f, MIT OR Apache-2.0).
#
# Reason: easyexcel depends on the fork's formula-evaluation engine
# (`xls::core::formula::Engine`) to compute BIFF8 cached formula results.
# A `path = "../../xls"` dependency pointing outside the repository broke
# clean CI checkouts (`failed to load manifest for dependency xls`), so the
# fork is vendored here like vendor/office-crypto. Sync by re-copying from
# the fork and bumping this header.
#
[package]
name = "xls"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Soham Zemse <soham@zemse.in>"]
description = "A terminal spreadsheet: read/write XLS (BIFF8), XLSX and CSV with a built-in formula engine, CLI and TUI."
repository = "https://github.com/zemse/xls"
keywords = ["spreadsheet", "excel", "xlsx", "xls", "tui"]
categories = ["command-line-utilities", "parser-implementations"]
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[features]
default = ["cli", "tui"]
cli = ["dep:clap"]
tui = ["dep:ratatui", "dep:crossterm", "dep:tui-textarea", "dep:arboard", "dep:unicode-width"]

[dependencies]
# core (always compiled)
quick-xml = "0.37"
zip = { version = "4", default-features = false, features = ["deflate"] }
cfb = "0.14"
# Decrypt password-protected (MS-OFFCRYPTO) workbooks: ECMA-376 agile + standard.
aes = "0.8"
sha1 = "0.10"
sha2 = "0.10"
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
encoding_rs = "0.8"
thiserror = "2"
anyhow = "1"
# Excel REGEX* worksheet functions (REGEXTEST/REGEXEXTRACT/REGEXREPLACE).
regex = { version = "1", default-features = false, features = ["std", "unicode"] }

# optional (feature-gated UI/CLI)
clap = { version = "4", features = ["derive"], optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
tui-textarea = { version = "0.7", optional = true }
arboard = { version = "3", optional = true }
unicode-width = { version = "0.2", optional = true }

[[bin]]
name = "xls"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "recalc"
path = "benches/recalc.rs"
harness = false

[lib]
name = "xls"
path = "src/lib.rs"

[profile.release]
lto = true
codegen-units = 1
