# cargo audit 豁免配置（docs/security-audit.md 有完整分析）
# 通过 office-crypto 0.3.0 传递依赖的 quick-xml 0.38.4（crates.io 最新版 office-crypto 仍固定 0.38.x）
# - 攻击面：仅密码保护 XLSX 的 EncryptionInfo 元数据解析（用户提供的本地文件）
# - SAX 解析路径使用工作区直接依赖 quick-xml 0.41.0（已修复），不受影响
# - 上游 office-crypto 未发布修复版本；无法通过 Cargo patch 跨大版本替换
[advisories]
ignore = [
    "RUSTSEC-2026-0195",  # quick-xml 0.38.4 NsReader 无界分配 DoS（office-crypto 传递依赖）
    "RUSTSEC-2026-0194",  # quick-xml 0.38.4 重复属性二次方 DoS（同上）
    "RUSTSEC-2024-0388",  # derivative 2.2.0 unmaintained（间接依赖，无已知利用）
    # xls fork（git 依赖）的 optional tui feature（default-features=false 关闭）
    # 解析出的未编译依赖：paste 1.0.15 unmaintained、lru 0.12.5 unsound
    # （ratatui→tui-textarea 链）。两者仅存在于 Cargo.lock，easyexcel 实际构建
    # 产物不含它们；workspace 编译链中的 lru 为 0.16.4（>= 0.16.3 patched）。
    "RUSTSEC-2024-0436",  # paste 1.0.15 unmaintained（xls tui feature 未编译链）
    "RUSTSEC-2026-0002",  # lru <0.16.3 unsound（xls tui feature 未编译链；编译链 0.16.4）
]
