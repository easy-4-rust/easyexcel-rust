name: Nightly Benchmark

on:
  schedule:
    # 每天 UTC 02:00 执行（北京时间 10:00）
    - cron: "0 2 * * *"
  workflow_dispatch:

# 同一时间只允许一个 nightly 实例，避免 baseline 比对竞争
concurrency:
  group: nightly-benchmark
  cancel-in-progress: false

jobs:
  nightly-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Check out Java 4.0.3 benchmark authority
        uses: actions/checkout@v4
        with:
          repository: easy-4-java/easyexcel
          ref: v4.0.3
          path: java

      # ── Rust 工具链（与 spec runtime_contract.rust_toolchain 一致） ──
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      # ── Java 17（run_matrix.py 需要双运行时 fixture 生成 + 交叉验证） ──
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 安装 en_US.UTF-8 locale（spec runtime_contract.locale 要求） ──
      - name: Install en_US locale and zlib dev
        run: |
          sudo apt-get update
          sudo apt-get install -y locales zlib1g-dev
          sudo locale-gen en_US.UTF-8

      # ── 编译 Rust benchmark runner ──
      - name: Build Rust benchmark runner (release)
        run: |
          # Embed the exact source and compiler provenance required by the comparator.
          EASYEXCEL_GIT_SHA="$(git rev-parse HEAD)" \
          EASYEXCEL_RUSTC="$(rustc --version | sed 's/^rustc //')" \
            cargo build --locked --release -p easyexcel-benchmark-runner
          echo "RUST_BIN=target/release/easyexcel-benchmark-runner" >> "$GITHUB_ENV"

      # ── 编译 Java benchmark runner ──
      # 与 benchmark.yml 使用同一 Java 源码和 test classpath，包含所有传递依赖。
      - name: Build Java benchmark runner
        run: |
          (cd java && ./mvnw -q -pl easyexcel-test -am -DskipTests test-compile)
          (cd java && ./mvnw -q -pl easyexcel-test dependency:build-classpath \
            -DincludeScope=test \
            -Dmdep.outputFile=target/benchmark-classpath.txt)
          module_classes="$(find java -type d -path '*/target/classes' -print | paste -sd: -)"
          dependencies="$(cat java/easyexcel-test/target/benchmark-classpath.txt)"
          java_test_classes="$PWD/java/easyexcel-test/target/test-classes"
          classpath="$java_test_classes:$module_classes:$dependencies"
          javac -encoding UTF-8 -cp "$classpath" -d "$java_test_classes" \
            $(find benchmarks/java-runner/src -name '*.java' -print | sort)
          echo "JAVA_CLASSPATH=$classpath" >> "$GITHUB_ENV"

      # ── 执行 nightly benchmark matrix ──
      - name: Run nightly benchmark matrix
        run: |
          python3 benchmarks/scripts/run_matrix.py \
            --profile nightly \
            --rust-bin "$RUST_BIN" \
            --rust-repo . \
            --java-bin java \
            --java-repo java \
            --java-classpath "$JAVA_CLASSPATH" \
            --output-dir /tmp/nightly-run

      # ── Baseline regression gate ──
      # compare_results.py 在 --require-baseline 模式下：
      #   - 若 baseline 缺失 → failures → exit 1
      #   - 若 median throughput 回退 > 10% → failures → exit 1
      #   - 若 peak RSS 回退 > 15% → failures → exit 1
      - name: Compare against baseline (regression gate)
        run: |
          python3 benchmarks/scripts/compare_results.py \
            /tmp/nightly-run/raw-results.jsonl \
            --spec benchmarks/spec/benchmark-suite-v1.json \
            --profile nightly \
            --baseline benchmarks/baselines/nightly-ubuntu-x64.json \
            --require-baseline \
            --output /tmp/compare-results.json

      # ── 上传比对报告 artifact ──
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-compare-results-${{ github.run_id }}
          path: /tmp/compare-results.json
          retention-days: 90

      # ── 上传原始结果（便于事后分析） ──
      - name: Upload raw benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-raw-results-${{ github.run_id }}
          path: /tmp/nightly-run/
          retention-days: 30
