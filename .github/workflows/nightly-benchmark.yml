name: Nightly Benchmark

on:
  schedule:
    # 每天 UTC 02:00 执行（北京时间 10:00）
    - cron: "0 2 * * *"
  workflow_dispatch:

# 同一时间只允许一个 nightly 实例，避免 baseline 比对竞争
concurrency:
  group: nightly-benchmark
  cancel-in-progress: false

jobs:
  nightly-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      # ── Rust 工具链（与 spec runtime_contract.rust_toolchain 一致） ──
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      # ── Java 17（run_matrix.py 需要双运行时 fixture 生成 + 交叉验证） ──
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 安装 en_US.UTF-8 locale（spec runtime_contract.locale 要求） ──
      - name: Install en_US locale and zlib dev
        run: |
          sudo apt-get update
          sudo apt-get install -y locales zlib1g-dev
          sudo locale-gen en_US.UTF-8

      # ── 编译 Rust benchmark runner ──
      - name: Build Rust benchmark runner (release)
        run: |
          cargo build --release -p easyexcel-benchmark-runner
          echo "RUST_BIN=target/release/easyexcel-benchmark-runner" >> "$GITHUB_ENV"

      # ── 编译 Java benchmark runner ──
      # Java runner 源码在 benchmarks/java-runner/src，需要 easyexcel Java v4.0.3 的依赖。
      # 此处从 Maven Central 拉取 easyexcel 4.0.3 JAR + 依赖，编译 runner class。
      - name: Build Java benchmark runner
        run: |
          EASYEXCEL_VERSION="4.0.3"
          JAVA_RUNNER_SRC="benchmarks/java-runner/src"
          JAVA_RUNNER_OUT="/tmp/java-runner-classes"
          JAVA_LIB_DIR="/tmp/easyexcel-java-libs"

          mkdir -p "$JAVA_RUNNER_OUT" "$JAVA_LIB_DIR"

          # 下载 easyexcel 4.0.3 及其传递依赖
          mvn dependency:copy-dependencies \
            -DoutputDirectory="$JAVA_LIB_DIR" \
            -DincludeArtifactIds=easyexcel \
            -Dartifact=com.alibaba:easyexcel:${EASYEXCEL_VERSION} \
            -Dtransitive=true \
            -f /dev/null 2>/dev/null || true

          # 如果 mvn 方式失败，用 mvn 直接下载
          if [ ! -f "$JAVA_LIB_DIR/easyexcel-${EASYEXCEL_VERSION}.jar" ]; then
            mvn org.apache.maven.plugins:maven-dependency-plugin:3.6.1:copy \
              -Dartifact=com.alibaba:easyexcel:${EASYEXCEL_VERSION} \
              -DoutputDirectory="$JAVA_LIB_DIR"
          fi

          CLASSPATH="$JAVA_LIB_DIR/*"

          # 编译 Java benchmark runner
          find "$JAVA_RUNNER_SRC" -name "*.java" | xargs javac \
            -cp "$CLASSPATH" \
            -d "$JAVA_RUNNER_OUT"

          echo "JAVA_CLASSPATH=$JAVA_RUNNER_OUT:$JAVA_LIB_DIR/*" >> "$GITHUB_ENV"

      # ── 执行 nightly benchmark matrix ──
      - name: Run nightly benchmark matrix
        run: |
          python3 benchmarks/scripts/run_matrix.py \
            --profile nightly \
            --rust-bin "$RUST_BIN" \
            --rust-repo . \
            --java-bin java \
            --java-classpath "$JAVA_CLASSPATH" \
            --output-dir /tmp/nightly-run

      # ── Baseline regression gate ──
      # compare_results.py 在 --require-baseline 模式下：
      #   - 若 baseline 缺失 → failures → exit 1
      #   - 若 median throughput 回退 > 10% → failures → exit 1
      #   - 若 peak RSS 回退 > 15% → failures → exit 1
      - name: Compare against baseline (regression gate)
        run: |
          python3 benchmarks/scripts/compare_results.py \
            /tmp/nightly-run/raw-results.jsonl \
            --spec benchmarks/spec/benchmark-suite-v1.json \
            --profile nightly \
            --baseline benchmarks/baselines/nightly-ubuntu-x64.json \
            --require-baseline \
            --output /tmp/compare-results.json

      # ── 上传比对报告 artifact ──
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-compare-results-${{ github.run_id }}
          path: /tmp/compare-results.json
          retention-days: 90

      # ── 上传原始结果（便于事后分析） ──
      - name: Upload raw benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-raw-results-${{ github.run_id }}
          path: /tmp/nightly-run/
          retention-days: 30
