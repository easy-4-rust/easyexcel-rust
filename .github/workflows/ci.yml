name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    # Java golden 期望文件在中文 locale 下导出（DateFormatTest 的 MMM 月份名），
    # 测试必须与生成环境一致；Rust 端跟随系统 locale（对齐 Java 默认 locale）
    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Install zh_CN locale and zlib dev
        run: |
          sudo apt-get update
          sudo apt-get install -y locales zlib1g-dev
          sudo locale-gen zh_CN.UTF-8
      - uses: dtolnay/rust-toolchain@master
        with:
          # 固定与本地验证一致的 1.97.1（rustup，与 CI 官方发行完全一致），
          # 消除最新 stable 的规则漂移；1.97.1 满足 salvo 0.95.1 的 rustc 1.94
          # 要求，高于 MSRV 1.94。
          toolchain: 1.97.1
          components: clippy,llvm-tools-preview,rustfmt
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
      - run: cargo fmt --all -- --check
      - run: cargo doc --workspace --all-features --no-deps
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: ./scripts/coverage.sh

  msrv:
    # MSRV 实测为 1.94：salvo 0.95.1（及其依赖 multra、salvo-serde-util 等）
    # 要求 rustc >= 1.94，与 root Cargo.toml 的 rust-version = "1.94" 一致。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94
      - run: cargo check --workspace --all-features
