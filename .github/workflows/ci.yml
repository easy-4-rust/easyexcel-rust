name: CI

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    # Java golden 期望文件在中文 locale 下导出（DateFormatTest 的 MMM 月份名），
    # 测试必须与生成环境一致；Rust 端跟随系统 locale（对齐 Java 默认 locale）
    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install zh_CN locale and zlib dev
        run: |
          sudo apt-get update
          sudo apt-get install -y locales zlib1g-dev
          sudo locale-gen zh_CN.UTF-8
      - uses: dtolnay/rust-toolchain@master
        with:
          # 固定与本地验证一致的 1.97.1（rustup，与 CI 官方发行完全一致），
          # 消除最新 stable 的规则漂移；1.97.1 满足 salvo 0.89.3 的 rustc 1.89
          # 要求，高于 Salvo 适配器的独立 MSRV 1.89。
          toolchain: 1.97.1
          components: clippy,llvm-tools-preview,rustfmt
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo audit
      - run: cargo deny check advisories bans licenses sources
      - run: cargo fmt --all -- --check
      - name: Validate shared benchmark harness
        run: |
          python3 -m py_compile benchmarks/scripts/*.py benchmarks/scripts/tests/*.py
          python3 -m unittest discover -s benchmarks/scripts/tests -v
      - run: cargo doc --workspace --all-features --no-deps
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # 覆盖率门禁只跑一次全量 llvm-cov（约 20 分钟），仅发布/手动触发时执行；
  # 日常 push/PR 不跑（本地脚本 scripts/coverage.sh 可按需运行）。
  coverage:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Install zh_CN locale and zlib dev
        run: |
          sudo apt-get update
          sudo apt-get install -y locales zlib1g-dev
          sudo locale-gen zh_CN.UTF-8
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,llvm-tools-preview,rustfmt
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: ./scripts/coverage.sh

  msrv:
    # 核心与 Salvo 适配器分别验证各自 MSRV；质量工具链仍固定为 1.97.1。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88
      - name: Check core workspace at Rust 1.88
        run: >-
          cargo check --workspace --all-features
          --exclude easyexcel-salvo
          --exclude easyexcel-demo-salvo
          --exclude easyexcel-web-conformance
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89
      - name: Check Salvo adapter at Rust 1.89
        run: cargo check -p easyexcel-salvo --all-features
