name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Java golden 期望文件在中文 locale 下导出（DateFormatTest 的 MMM 月份名）。
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
    steps:
      - uses: actions/checkout@v5

      - name: Install zh_CN locale and zlib dev (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y locales zlib1g-dev
          sudo locale-gen zh_CN.UTF-8

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 固定与本地验证一致的 1.97.1（消除最新 stable 的规则漂移；
          # 1.97.1 满足 salvo 0.89.3 的 rustc 1.89 要求）。
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets --all-features

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      - name: Doctest
        run: cargo test --workspace --doc --all-features

      - name: Examples build
        run: cargo build --workspace --examples --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
    steps:
      - uses: actions/checkout@v5

      - name: Install zh_CN locale and zlib dev
        run: |
          sudo apt-get update
          sudo apt-get install -y locales zlib1g-dev
          sudo locale-gen zh_CN.UTF-8

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  doc:
    name: Doc build
    runs-on: ubuntu-latest
    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
    steps:
      - uses: actions/checkout@v5

      - name: Install zh_CN locale and zlib dev
        run: |
          sudo apt-get update
          sudo apt-get install -y locales zlib1g-dev
          sudo locale-gen zh_CN.UTF-8

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo doc
        run: cargo doc --workspace --all-features --no-deps

  bench-build:
    name: Bench build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate benchmark harness (Python)
        run: |
          python3 -m py_compile benchmarks/scripts/*.py benchmarks/scripts/tests/*.py
          python3 -m unittest discover -s benchmarks/scripts/tests -v

      - name: Build benchmarks
        run: cargo build --workspace --benches --all-features

  # 覆盖率门禁只跑一次全量 llvm-cov（约 20 分钟），仅发布/手动触发时执行。
  coverage:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
    steps:
      - uses: actions/checkout@v5
      - name: Install zh_CN locale and zlib dev
        run: |
          sudo apt-get update
          sudo apt-get install -y locales zlib1g-dev
          sudo locale-gen zh_CN.UTF-8
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: ./scripts/coverage.sh
      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ github.sha }}
          path: coverage/
          retention-days: 30
      - name: Upload coverage lcov
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-${{ github.sha }}
          path: coverage/lcov.info
          retention-days: 90

  # T5.2: PR coverage — generates lcov for diff analysis (no gate)。
  coverage-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
    steps:
      - uses: actions/checkout@v5
      - name: Install zh_CN locale and zlib dev
        run: |
          sudo apt-get update
          sudo apt-get install -y locales zlib1g-dev
          sudo locale-gen zh_CN.UTF-8
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate lcov report (no gate)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov \
            --workspace \
            --all-features \
            --ignore-filename-regex 'easyexcel-derive/src/lib\.rs|easyexcel-reader/src/locale_generated\.rs' \
            --lcov \
            --output-path lcov.info
      - name: Upload PR coverage lcov
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-pr-${{ github.event.pull_request.number }}
          path: lcov.info
          retention-days: 30
      - name: Convert lcov to Cobertura XML
        run: |
          pip install lcov_cobertura
          lcov_cobertura lcov.info -o coverage.xml -b "${{ github.workspace }}"
      - name: Post coverage comment on PR
        uses: 5monkeys/cobertura-action@master
        with:
          path: coverage.xml
          repo_token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    # 核心与 Salvo 适配器分别验证各自 MSRV；质量工具链仍固定为 1.97.1。
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install zh_CN locale and zlib dev
        run: |
          sudo apt-get update
          sudo apt-get install -y locales zlib1g-dev
          sudo locale-gen zh_CN.UTF-8

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88

      - name: Check core workspace at Rust 1.88
        run: >-
          cargo check --workspace --all-features
          --exclude easyexcel-salvo
          --exclude easyexcel-demo-salvo
          --exclude easyexcel-web-conformance

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89

      - name: Check Salvo adapter at Rust 1.89
        run: cargo check -p easyexcel-salvo --all-features
