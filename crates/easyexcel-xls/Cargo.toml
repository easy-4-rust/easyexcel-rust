[package]
name = "easyexcel-xls"
readme = "README.md"
description = "BIFF8 XLS reader and writer for easyexcel-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["xls-lazy-sst"]
## 启用 SST 延迟解码：保留原始字节，首次按索引访问时才解码字符串。
## 关闭此 feature 回退到旧的立即解码路径。
xls-lazy-sst = []
## 启用流式 record 迭代器：从 BufRead + Seek 源按需读取 BIFF record，
## 替代旧的需要整个子流切片的 Records<'a> 路径。
xls-streaming-iter = []

[dependencies]
cfb.workspace = true
chrono.workspace = true
easyexcel-formula.workspace = true
easyexcel-format.workspace = true
easyexcel-io.workspace = true
easyexcel-model.workspace = true
getrandom.workspace = true
md-5.workspace = true
sha1.workspace = true

[dev-dependencies]
base64.workspace = true
flate2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
