[package]
name = "easyexcel"
readme = "README.md"
description = "A Rust implementation of the Alibaba EasyExcel programming model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# 内部 derive-only 过程宏；用户统一通过 easyexcel 门面使用。
easyexcel-derive.workspace = true
# 原 easyexcel-core 依赖
bigdecimal.workspace = true
chrono.workspace = true
num-bigint.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
# 原 easyexcel-reader 依赖
# 统一工作簿模型与公式引擎；不再依赖完整的 xls fork。
easyexcel-csv.workspace = true
easyexcel-cache.workspace = true
easyexcel-format.workspace = true
easyexcel-utils.workspace = true
easyexcel-io.workspace = true
easyexcel-model.workspace = true
easyexcel-formula.workspace = true
easyexcel-markdown.workspace = true
easyexcel-xls.workspace = true
easyexcel-xlsx.workspace = true
easyexcel-tabular.workspace = true
indexmap.workspace = true
tempfile.workspace = true
# OLE2 复合文档读取（仅 xls-streaming-iter feature 需要）
cfb = { workspace = true, optional = true }

[features]
default = ["xls-lazy-sst"]
## 启用 XLS SST 延迟解码（传递给 easyexcel-xls）。
xls-lazy-sst = ["easyexcel-xls/xls-lazy-sst"]
## 启用 XLS 流式 record 迭代器（传递给 easyexcel-xls）。
## 在 `xls_sax_analyser` 中使用 `StreamingRecordIter` 替代旧的 `&[u8]` 切片遍历路径，
## 使得非加密 XLS 文件可以从 CFB Stream 直接流式读取 record，无需将整个 Workbook 流加载到内存。
xls-streaming-iter = ["easyexcel-xls/xls-streaming-iter", "dep:cfb"]

[dev-dependencies]
base64.workspace = true
calamine.workspace = true
cfb.workspace = true
csv.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
rust_xlsxwriter.workspace = true
ssfmt.workspace = true
zip.workspace = true
# 读取/写入管线的回调契约测试（MockReadListener 断言调用次数/顺序/参数）
mockall = "0.15"
sha2.workspace = true
trybuild = "1"

[lints]
workspace = true
